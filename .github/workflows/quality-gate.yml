name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Verify tool samples
        run: node scripts/check-samples.mjs

      - name: Verify SEO lengths
        run: python3 scripts/check-seo-lengths.py

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://toolhub.axtrivc.com

      - name: Verify static output
        run: test -f out/index.html && test -f out/sitemap.xml
