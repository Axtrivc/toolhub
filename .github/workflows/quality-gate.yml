name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tool and infrastructure regression tests
        run: |
          npm run smoke
          node scripts/test-flagship.mjs
          node scripts/test-json-repair.mjs
          node scripts/test-service-worker.mjs
          node scripts/test-related-tools.mjs
          python3 scripts/seo-audit.test.py
          python3 scripts/test-gsc-analysis.py

      - name: Verify tool samples
        run: node scripts/check-samples.mjs

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://toolhub.axtrivc.com

      - name: Type check
        run: npm run lint

      - name: Verify static output
        run: test -f out/index.html && test -f out/sitemap.xml

      - name: Verify rendered SEO metadata and sitemap
        run: node scripts/verify-seo-export.mjs

      - name: Audit every exported HTML page and internal link graph
        run: python3 scripts/seo-audit.py

      - name: Install Chromium for mobile browser regressions
        run: npx playwright-core install --with-deps chromium

      - name: Mobile browser and no-JavaScript regressions
        run: |
          node scripts/static-server.mjs out 3100 > /tmp/seo-static.log 2>&1 &
          node scripts/seo-browser.mjs reports/seo/browser-final.json

      - name: Retain rendered SEO inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-page-inventory
          path: |
            reports/seo/page-inventory.*
            reports/seo/browser-final.json
          if-no-files-found: warn
